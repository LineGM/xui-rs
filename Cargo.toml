[package]
name = "xui-rs"
version = "1.0.2"
edition = "2024"
rust-version = "1.88"
authors = ["Gleb Gudkov <GudkovGO@tutamail.com>"]
description = "A modern, typed async Rust SDK for the 3x-ui panel API"
license = "Unlicense"
readme = "README.md"
repository = "https://github.com/LineGM/xui-rs"
homepage = "https://github.com/LineGM/xui-rs"
documentation = "https://docs.rs/xui-rs"

keywords = ["3x-ui", "xray", "sdk", "api", "async"]
categories = ["api-bindings", "web-programming::http-client"]
include = [
    "api/**",
    "src/**",
    "docs/**",
    "examples/**",
    "scripts/**",
    "tests/**",
    "spec/**",
    "Cargo.toml",
    "CHANGELOG.md",
    "README.md",
    "LICENSE",
]

[dependencies]
base64 = "0.23.1"
futures-util = "0.3.34"
httparse = "1.10.1"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.4", features = ["cookies", "form", "json", "multipart", "query", "socks"] }
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "0.8.4"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "net", "sync", "time"] }
tokio-rustls = "0.26.4"
tokio-socks = "0.5.3"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
wiremock = "0.6.5"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
