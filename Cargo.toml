[package]
name = "xui-rs"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Gleb Gudkov <GudkovGO@tutamail.com>"]
description = "A modern, typed async Rust SDK for the 3x-ui panel API"
license = "Unlicense"
readme = "README.md"
repository = "https://github.com/LineGM/xui-rs"
homepage = "https://github.com/LineGM/xui-rs"
documentation = "https://docs.rs/xui-rs"

keywords = ["3x-ui", "xray", "sdk", "api", "async"]
categories = ["api-bindings", "web-programming::http-client"]
include = [
    "src/**",
    "docs/**",
    "examples/**",
    "tests/**",
    "spec/**",
    "Cargo.toml",
    "CHANGELOG.md",
    "README.md",
    "LICENSE",
]

[dependencies]
percent-encoding = "2.3.2"
reqwest = { version = "0.13.4", features = ["cookies", "form", "json", "multipart", "query"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["sync"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
