name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: clippy,rustfmt
      - name: Install pinned nightly
        run: rustup toolchain install nightly-2026-08-31 --profile minimal
      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-public-api
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-public-api@0.52.0
      - name: Read and validate version
        id: version
        shell: bash
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "xui-rs") | .version')"
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Validate release tag provenance
        if: github.ref_type == 'tag'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]]; then
            echo "release tags must be annotated or signed" >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "release tag commit is not reachable from origin/main" >&2
            exit 1
          fi
          if ! grep --fixed-strings --quiet "## [$VERSION] - " CHANGELOG.md; then
            echo "CHANGELOG.md has no dated section for $VERSION" >&2
            exit 1
          fi
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test all targets
        run: cargo test --locked --all-targets --all-features
      - name: Test documentation
        run: cargo test --locked --doc --all-features
      - name: Build documentation
        run: cargo doc --locked --no-deps --all-features
      - name: Check public API snapshot
        run: scripts/public-api.sh check
      - name: Install actionlint
        run: sh scripts/install-actionlint.sh
      - name: Lint GitHub Actions workflows
        run: actionlint
      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - name: Build publishable crate
        run: scripts/package-check.sh "$RUNNER_TEMP/package-target"
      - name: Upload crate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xui-rs-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/package-target/package/xui-rs-${{ steps.version.outputs.version }}.crate
          if-no-files-found: error
          retention-days: 30

  msrv:
    name: Verify MSRV 1.88.0
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check library on the MSRV
        run: cargo check --locked --lib

  portability:
    name: Test release on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test all targets
        run: cargo test --locked --all-targets --all-features

  live:
    name: Verify against 3x-ui v3.6.0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test against isolated 3x-ui
        run: scripts/live-test.sh

  publish:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [verify, msrv, portability, live]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - name: Download verified crate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xui-rs-${{ needs.verify.outputs.version }}
          path: dist
      - name: Reproduce verified crate
        shell: bash
        run: |
          cargo package --locked
          cmp "target/package/xui-rs-${{ needs.verify.outputs.version }}.crate" "dist/xui-rs-${{ needs.verify.outputs.version }}.crate"
      - name: Attest crate provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/xui-rs-${{ needs.verify.outputs.version }}.crate
      - name: Check for an existing crates.io version
        id: crates_version
        shell: bash
        run: |
          response="$RUNNER_TEMP/crates-version.json"
          status="$(curl --silent --show-error --location --output "$response" --write-out "%{http_code}" --user-agent "xui-rs-release/$GITHUB_RUN_ID" "https://crates.io/api/v1/crates/xui-rs/${{ needs.verify.outputs.version }}")"
          case "$status" in
            200)
              remote_checksum="$(jq -er '.version.checksum' "$response")"
              read -r local_checksum _ < <(sha256sum "dist/xui-rs-${{ needs.verify.outputs.version }}.crate")
              if [[ "$remote_checksum" != "$local_checksum" ]]; then
                echo "crates.io already has this version with a different checksum" >&2
                exit 1
              fi
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "crates.io returned unexpected HTTP status $status" >&2
              exit 1
              ;;
          esac
      - name: Authenticate to crates.io with OIDC
        if: steps.crates_version.outputs.exists != 'true'
        id: crates_io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish to crates.io
        if: steps.crates_version.outputs.exists != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io.outputs.token }}
      - name: Create or repair GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ github.ref_name }}"; then
            gh release upload "${{ github.ref_name }}" "dist/xui-rs-${{ needs.verify.outputs.version }}.crate" --clobber
          else
            gh release create "${{ github.ref_name }}" "dist/xui-rs-${{ needs.verify.outputs.version }}.crate" --verify-tag --generate-notes --title "xui-rs ${{ needs.verify.outputs.version }}"
          fi
