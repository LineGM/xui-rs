# Supply-chain policy enforced by `cargo deny check` and CI.

[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    { crate = "native-tls", reason = "The SDK deliberately uses rustls on every platform" },
    { crate = "openssl", reason = "The SDK deliberately uses rustls on every platform" },
    { crate = "openssl-sys", reason = "The SDK must not require a system OpenSSL installation" },
]
skip = [
    { crate = "base64@0.22.1", reason = "reqwest 0.13 and wiremock have not adopted base64 0.23 yet" },
    { crate = "core-foundation@0.9.4", reason = "hyper-util and rustls platform support require different major versions" },
    { crate = "syn@2.0.119", reason = "some transitive derive crates have not adopted syn 3 yet" },
    { crate = "thiserror@1.0.69", reason = "tokio-socks 0.5 has not adopted thiserror 2 yet" },
    { crate = "thiserror-impl@1.0.69", reason = "required by the allowed thiserror 1 dependency" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
